[build]
  publish = "dist/"
  command = "yarn build"

[template.environment]
  # TODO
  VITE_CLIENT_ID = "replace me with your OAuth Client Id"
  # TODO
  VITE_CLIENT_SECRET = "replace me your OAuth Client Secred"

[[redirects]]
  from = "/api/*"
  to = "https://streamlabs.com/api/v2.0/:splat"
  status = 200
  force = true
  [redirects.headers]
    X-From = "Netlify"
    access-control-allow-origin = "*"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
